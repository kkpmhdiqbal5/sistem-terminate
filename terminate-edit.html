<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edit Nama & CID - Sistem Terminate</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="auth.js"></script>
  <script src="terminate-core.js"></script>
</head>
<body>
  <div class="container px-3 pt-3">
    <div class="card-custom p-3 mb-3">
      <div class="fw-bold text-white mb-2">✏️ Edit Nama & CID <span class="kecil">(3 hari terakhir)</span></div>
      <div class="row g-2 align-items-end">
        <div class="col-8"><select id="filter" class="form-select form-select-dark">
          <option value="belum">Belum lengkap (Nama/CID kosong)</option><option value="semua">Semua data</option></select></div>
        <div class="col-4"><button id="btnMuat" class="btn btn-info btn-sm w-100 fw-bold py-2">🔄 Muat</button></div>
      </div>
      <div id="pesan" class="mt-2"></div>
    </div>
    <div id="daftar"></div>
  </div>
  <script>
    var S = TMC.init({ active: 'edit', title: '✏️ Edit' });

    var $ = function (id) { return document.getElementById(id); };
    function pesan(t, j) { $('pesan').innerHTML = t ? '<div class="alert alert-' + j + ' py-2 mb-0 small">' + TMC.esc(t) + '</div>' : ''; }
    function foto(x) {
      var t = TMC.thumb(x.foto, 200);
      return t ? '<a href="' + TMC.esc(x.foto) + '" target="_blank" rel="noopener"><img class="thumb" src="' + TMC.esc(t) + '" alt="Foto"></a>' : '';
    }
    function kartu(x, extra) {
      return '<div class="card-custom p-3 mb-2"><div class="d-flex gap-3">' + foto(x) + '<div class="small flex-grow-1">' +
        '<div class="kecil">' + TMC.esc(x.waktu) + ' | <b class="text-info">' + TMC.esc(x.admin) + '</b> | ' + TMC.esc(x.jenis) + '</div>' +
        '<div><b>' + TMC.esc(x.nama || '(nama belum diisi)') + '</b> | CID: ' + TMC.esc(x.cid || '-') + '</div>' +
        '<div>POP: ' + TMC.esc(x.pop) + ' | ODP: ' + TMC.esc(x.odp) + '</div>' +
        (x.sn || x.psn ? '<div>SN: ' + TMC.esc(x.sn || '-') + ' | P-SN: ' + TMC.esc(x.psn || '-') + '</div>' : '') +
        '<div class="kecil">Verif: ' + TMC.esc(x.verif || '-') + '</div>' + (extra || '') + '</div></div></div>';
    }
    function salin(t) {
      if (navigator.clipboard && navigator.clipboard.writeText) return navigator.clipboard.writeText(t);
      var a = document.createElement('textarea'); a.value = t; document.body.appendChild(a); a.select(); document.execCommand('copy'); a.remove(); return Promise.resolve();
    }

    var semua = [];
    function render() {
      var d = $('daftar'); d.innerHTML = '';
      var m = $('filter').value, list = semua.filter(function (x) { return m === 'semua' || !x.nama || !x.cid; });
      if (!list.length) { d.innerHTML = '<div class="text-center text-secondary py-4">' + (m === 'belum' ? 'Tidak ada data yang perlu dilengkapi.' : 'Belum ada data.') + '</div>'; return; }
      list.forEach(function (x) {
        var w = document.createElement('div');
        w.innerHTML = kartu(x, x.diedit ? '<div class="kecil">Diedit oleh: ' + TMC.esc(x.diedit) + '</div>' : '') +
          '<div class="row g-2 mb-3 mt-0"><div class="col-12 col-md-5"><input class="form-control form-control-dark" data-f="nama" placeholder="Nama" value="' + TMC.esc(x.nama) + '"></div>' +
          '<div class="col-8 col-md-5"><input class="form-control form-control-dark" data-f="cid" inputmode="numeric" placeholder="CID" value="' + TMC.esc(x.cid) + '"></div>' +
          '<div class="col-4 col-md-2"><button class="btn btn-success btn-sm w-100 fw-bold py-2">Simpan</button></div></div>';
        var btn = w.querySelector('button'), inN = w.querySelector('[data-f=nama]'), inC = w.querySelector('[data-f=cid]');
        btn.onclick = function () {
          var nama = inN.value.trim(), cid = inC.value.replace(/\s+/g, '');
          if (!nama || !cid) { alert('Nama dan CID wajib diisi.'); return; }
          if (!/^\d{6,20}$/.test(cid)) { alert('CID harus angka (6-20 digit).'); return; }
          btn.disabled = true; btn.textContent = '...';
          TMC.api('terminateEditSimpan', { id: x.id, nama: nama, cid: cid }).then(function (r) {
            if (r.status === 'success') { x.nama = nama; x.cid = cid; x.diedit = S.user; pesan('Tersimpan: ' + nama + ' (' + cid + ')', 'success'); render(); }
            else { alert(r.message); btn.disabled = false; btn.textContent = 'Simpan'; }
          }).catch(function () { alert('Gagal terhubung ke server.'); btn.disabled = false; btn.textContent = 'Simpan'; });
        };
        while (w.firstChild) d.appendChild(w.firstChild);
      });
    }
    function muat() {
      var b = $('btnMuat'); b.disabled = true; pesan('Memuat...', 'secondary');
      TMC.api('terminateEditList').then(function (r) {
        if (r.status !== 'success') { pesan(r.message, 'danger'); return; }
        pesan('', ''); semua = r.data; render();
      }).catch(function () { pesan('Gagal terhubung ke server.', 'danger'); }).finally(function () { b.disabled = false; });
    }
    $('btnMuat').onclick = muat; $('filter').onchange = render; muat();
  </script>
</body>
</html>
