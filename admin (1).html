<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Info Perangkat - Sistem Lapangan</title>
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

  <style>
    body { background-color: #0b132b; color: #e0e6ed; font-family: 'Segoe UI', sans-serif; padding-bottom: 85px; }
    .top-bar { background-color: #1c2541; padding: 14px 20px; border-bottom: 1px solid #2a385b; }
    .card-custom { background-color: #1c2541; border: 1px solid #2a385b; border-radius: 12px; }
    .form-control-dark { background-color: #0b132b; border: 1px solid #3a506b; color: #ffffff; }
    .form-control-dark:focus { background-color: #0b132b; color: #fff; border-color: #38bdf8; box-shadow: none; }
    
    .table-custom { color: #e0e6ed !important; font-size: 0.8rem; white-space: nowrap; }
    .table-custom th { background-color: #2a385b !important; color: #ffffff !important; border-bottom: none; text-align: center; vertical-align: middle; }
    .table-custom td { border-bottom: 1px solid #2a385b !important; background-color: #1c2541 !important; color: #e0e6ed !important; vertical-align: middle; text-align: center; }

    /* BOTTOM NAVIGATION BAR */
    .bottom-app-nav { 
      position: fixed; bottom: 0; left: 0; right: 0; 
      background: #1c2541; border-top: 1px solid #2a385b; 
      display: flex; justify-content: space-around; align-items: center;
      padding: 6px 0; z-index: 1000; height: 65px;
    }
    .nav-link-mobile { display: flex; flex-direction: column; align-items: center; text-decoration: none; color: #94a3b8; font-size: 0.7rem; font-weight: 600; flex: 1; }
    .nav-link-mobile.active { color: #38bdf8; }
    .nav-icon { font-size: 1.2rem; margin-bottom: 2px; }
    .nav-link-center { position: relative; top: -12px; display: flex; flex-direction: column; align-items: center; text-decoration: none; }
    .nav-center-circle {
      background: linear-gradient(135deg, #22c55e, #16a34a); color: white;
      width: 50px; height: 50px; border-radius: 50%; display: flex;
      align-items: center; justify-content: center; font-size: 1.5rem;
      box-shadow: 0 4px 15px rgba(34, 197, 94, 0.5); border: 3px solid #0b132b;
    }
    .nav-center-label { font-size: 0.7rem; font-weight: 700; color: #22c55e; margin-top: 2px; }
  </style>
</head>
<body>

  <!-- Top Bar -->
  <div class="top-bar d-flex justify-content-between align-items-center mb-3">
    <div class="fw-bold fs-6 text-white" id="headerTitle">💻 Alat Menunggu Verif (Baris 1)</div>
    <button onclick="toggleTampilanSheet()" id="btnToggleSheet" class="btn btn-sm btn-outline-warning fw-bold px-3">Lihat Data Terverifikasi (Baris 2)</button>
  </div>

  <div class="container-fluid px-3">
    
    <div class="card-custom p-3 mb-3">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h6 class="text-info fw-bold m-0" id="subHeaderTitle">⚙ Data Alat di Baris 1</h6>
        <button onclick="fetchData()" class="btn btn-sm btn-info fw-bold text-dark px-3">🔄 Muat Ulang</button>
      </div>

      <!-- FILTER PENCARIAN & TOMBOL WA GABUNGAN (Disatukan sejajar) -->
      <div class="row g-2">
        <div class="col-12 col-md-6">
          <input type="text" id="searchInput" class="form-control form-control-dark" placeholder="Ketik kata kunci pencarian (Nama, SN, CID)..." onkeyup="searchTable()">
        </div>
        <div class="col-12 col-md-3">
          <input type="date" id="searchDate" class="form-control form-control-dark" title="Cari berdasarkan Tanggal Verif/Input" onchange="searchTable()">
        </div>
        <div class="col-12 col-md-3">
          <button class="btn btn-info text-dark fw-bold w-100" onclick="kirimWAGabungan()">📲 WA Gabungan</button>
        </div>
      </div>
    </div>

    <!-- Table Section -->
    <div class="card-custom p-0 overflow-hidden mb-4">
      <div class="d-flex justify-content-between align-items-center p-2" style="background-color: #162032;">
        <div class="fw-bold text-white small ms-2">📱 Daftar Perangkat</div>
        <span class="badge bg-info text-dark" id="totalDataCount">0 Data</span>
      </div>
      
      <div class="table-responsive">
        <table class="table table-custom mb-0">
          <thead>
            <tr>
              <!-- Checkbox (Centang) sekarang aktif di kedua halaman agar WA Gabungan tetap berfungsi -->
              <th style="width: 40px;" id="colCheckAll"><input type="checkbox" class="form-check-input" id="checkAll" onchange="toggleCheckAll(this)"></th>
              <th>WAKTU</th>
              <th>POP</th>
              <th>ODP</th>
              <th>CID LAMA</th>
              <th>NAMA LAMA</th>
              <th>SN UNIT</th>
              <th>P-SN</th>
              <th>FOTO RUMAH</th>
              <th>FOTO ALAT</th>
              <th>LOKASI</th>
              <th>KET</th>
              <th class="text-warning">AKSI</th>
            </tr>
          </thead>
          <tbody id="tableBody">
            <tr><td colspan="13" class="text-center py-4 text-muted">Silakan tunggu...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
    
  </div>

  <!-- Modal Pop-up Validasi Verifikasi (DENGAN FITUR KAMERA) -->
  <div class="modal fade" id="modalVerif" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content" style="background-color: #1c2541; border: 1px solid #3a506b; color: #fff;">
        <div class="modal-header" style="border-bottom: 1px solid #2a385b;">
          <h5 class="modal-title text-warning fw-bold">Verifikasi & Pindah Baris 2</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <p class="small text-info mb-3" id="teksInfoVerif"></p>
          <label class="form-label small fw-bold text-secondary">Silakan scan atau ketik (SN / P-SN / CID):</label>
          
          <div class="input-group mb-3">
            <input type="text" id="inputModalVerif" class="form-control form-control-dark" placeholder="Ketik manual di sini..." onkeypress="if(event.key === 'Enter') prosesModalVerif()">
            <button class="btn btn-warning text-dark fw-bold" type="button" onclick="mulaiKameraModal()">📷 Scan Kamera</button>
          </div>
          
          <!-- Area untuk menampilkan kamera di dalam Pop-up -->
          <div id="readerModal" style="display: none; background-color: #fff; border-radius: 8px; overflow: hidden; color: #000;"></div>
        
        </div>
        <div class="modal-footer" style="border-top: 1px solid #2a385b;">
          <button type="button" class="btn btn-secondary btn-sm fw-bold" data-bs-dismiss="modal">Batal</button>
          <button type="button" class="btn btn-warning text-dark btn-sm fw-bold" id="btnVerifModalAction" onclick="prosesModalVerif()">✔ Cocokkan & Pindah</button>
        </div>
      </div>
    </div>
  </div>

  <!-- BOTTOM NAVIGATION BAR -->
  <div class="bottom-app-nav">
    <a href="search.html" class="nav-link-mobile">
      <div class="nav-icon">🔍</div><span>Cari</span>
    </a>
    <a href="admin.html" class="nav-link-mobile active">
      <div class="nav-icon">💻</div><span>Perangkat</span>
    </a>
    <a href="index.html" class="nav-link-center">
      <div class="nav-center-circle">📝</div>
      <span class="nav-center-label">Form Lapangan</span>
    </a>
    <a href="laporan.html" class="nav-link-mobile">
      <div class="nav-icon">📊</div><span>Laporan</span>
    </a>
  </div>

  <script>
    // GANTI DENGAN URL DEPLOYMENT APPS SCRIPT ANDA
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzsS4-LPktyuUKoC6Cf6TERV498wqvm31frvD7-W0gFhrCb9fkgwVBjAHeLrEeVMd25/exec";
    
    let globalDataList = [];
    let modeSheetAktif = "Baris 1"; 
    
    // Variabel Modal & Kamera Pop-up
    let modalVerifInstance = null;
    let currentVerifIndex = -1;
    let html5QrcodeScannerModal = null;

    if (!localStorage.getItem("user_session")) {
      window.location.href = "login.html";
    }

    function toggleTampilanSheet() {
      if (modeSheetAktif === "Baris 1") {
        modeSheetAktif = "Baris 2";
        document.getElementById("btnToggleSheet").innerText = "Kembali ke Baris 1 (Belum Verif)";
        document.getElementById("btnToggleSheet").classList.replace("btn-outline-warning", "btn-warning");
        document.getElementById("headerTitle").innerText = "✅ Alat Terverifikasi (Baris 2)";
        document.getElementById("subHeaderTitle").innerText = "Data Alat yang Sudah Selesai (Baris 2)";
      } else {
        modeSheetAktif = "Baris 1";
        document.getElementById("btnToggleSheet").innerText = "Lihat Data Terverifikasi (Baris 2)";
        document.getElementById("btnToggleSheet").classList.replace("btn-warning", "btn-outline-warning");
        document.getElementById("headerTitle").innerText = "💻 Alat Menunggu Verif (Baris 1)";
        document.getElementById("subHeaderTitle").innerText = "Data Alat di Baris 1";
      }
      fetchData(); 
    }

    function fetchData() {
      const tbody = document.getElementById('tableBody');
      tbody.innerHTML = `<tr><td colspan="13" class="text-center py-4 text-white">Memuat data dari sheet '${modeSheetAktif}'...</td></tr>`;
      document.getElementById('checkAll').checked = false;
      
      fetch(SCRIPT_URL + "?action=getInfoPerangkat&sheetName=" + encodeURIComponent(modeSheetAktif))
        .then(response => response.json())
        .then(res => {
          if (res.status === "success") {
            globalDataList = res.data;
            renderTable(globalDataList);
          } else {
            alert("Gagal memuat: " + res.message);
          }
        })
        .catch(err => {
          tbody.innerHTML = `<tr><td colspan="13" class="text-center text-danger py-4">Koneksi Error</td></tr>`;
        });
    }

    function renderTable(data) {
      document.getElementById('totalDataCount').innerText = `${data.length} Data`;
      const tbody = document.getElementById('tableBody');
      tbody.innerHTML = "";

      if (data.length === 0) {
        tbody.innerHTML = `<tr><td colspan="13" class="text-center py-4 text-white">Tidak ada data ditemukan</td></tr>`;
        return;
      }

      data.forEach((row, index) => {
        let tr = document.createElement('tr');
        tr.id = `row-${index}`;
        
        let linkRumah = row.foto_rumah_url !== "-" ? `<a href="${row.foto_rumah_url}" target="_blank" class="text-info text-decoration-none fw-bold">Lihat</a>` : "-";
        let linkAlat = row.foto_alat_url !== "-" ? `<a href="${row.foto_alat_url}" target="_blank" class="text-info text-decoration-none fw-bold">Lihat</a>` : "-";
        let linkMaps = row.sherlock && row.sherlock.includes(",") ? `<a href="https://www.google.com/maps?q=${row.sherlock}" target="_blank" class="text-warning text-decoration-none">📍 Maps</a>` : "-";

        let chkDisplay = `<td><input type="checkbox" class="form-check-input row-check" value="${index}"></td>`;
        
        let btnVerif = modeSheetAktif === "Baris 1" ? `<button class="btn btn-warning text-dark btn-sm fw-bold px-2 py-0 mb-1 w-100" onclick="bukaModalVerif(${index})">✔ Verif</button><br>` : "";
        let btnWA1 = `<button class="btn btn-success btn-sm fw-bold px-2 py-0 w-100" onclick="kirimWASatu(${index})">📲 WA</button>`;

        tr.innerHTML = `
          ${chkDisplay}
          <td>${row.timestamp || "-"}</td>
          <td>${row.pop || "-"}</td>
          <td class="text-info fw-bold">${row.odp || "-"}</td>
          <td>${row.cid_lama || "-"}</td>
          <td class="fw-bold">${row.nama_lama || "-"}</td>
          <td class="text-success fw-bold">${row.sn || "-"}</td>
          <td>${row.psn || "-"}</td>
          <td>${linkRumah}</td>
          <td>${linkAlat}</td>
          <td>${linkMaps}</td>
          <td>${row.keterangan || "-"}</td>
          <td style="min-width: 80px;">${btnVerif}${btnWA1}</td>
        `;
        tbody.appendChild(tr);
      });
    }

    // ============================================
    // LOGIKA POP-UP (MODAL) DENGAN SCANNER
    // ============================================

    function bukaModalVerif(index) {
      currentVerifIndex = index;
      let row = globalDataList[index];
      
      document.getElementById('teksInfoVerif').innerHTML = `Memverifikasi alat milik:<br><span class="fs-6 text-white fw-bold">${row.nama_lama || row.cid_lama}</span>`;
      document.getElementById('inputModalVerif').value = "";
      
      if (!modalVerifInstance) {
        modalVerifInstance = new bootstrap.Modal(document.getElementById('modalVerif'));
        // Event listener saat modal tertutup (Batal/Close) agar kamera ikut mati
        document.getElementById('modalVerif').addEventListener('hidden.bs.modal', stopKameraModal);
      }
      
      modalVerifInstance.show();
      setTimeout(() => { document.getElementById('inputModalVerif').focus(); }, 500);
    }

    // FUNGSI MENGHIDUPKAN KAMERA DI DALAM MODAL
    function mulaiKameraModal() {
      const readerDiv = document.getElementById('readerModal');
      if (readerDiv.style.display === "block") {
        stopKameraModal();
        return;
      }
      
      readerDiv.style.display = "block";
      html5QrcodeScannerModal = new Html5QrcodeScanner("readerModal", { fps: 10, qrbox: {width: 250, height: 250} }, false);
      html5QrcodeScannerModal.render((decodedText, decodedResult) => {
          // Ketika berhasil scan barcode
          document.getElementById('inputModalVerif').value = decodedText;
          stopKameraModal();
          prosesModalVerif(); // Otomatis trigger kecocokan
      }, (error) => {});
    }

    // FUNGSI MEMATIKAN KAMERA DI DALAM MODAL
    function stopKameraModal() {
      const readerDiv = document.getElementById('readerModal');
      if (html5QrcodeScannerModal) {
        html5QrcodeScannerModal.clear().then(() => {
          html5QrcodeScannerModal = null;
          readerDiv.style.display = "none";
        }).catch(e => {
          html5QrcodeScannerModal = null;
          readerDiv.style.display = "none";
        });
      } else {
         readerDiv.style.display = "none";
      }
    }

    // PROSES PENCOCOKAN DAN PINDAH OTOMATIS KE BARIS 2
    function prosesModalVerif() {
      let inputVal = document.getElementById('inputModalVerif').value.trim().toLowerCase();
      if(!inputVal) {
        alert("Input tidak boleh kosong!");
        return;
      }
      
      let row = globalDataList[currentVerifIndex];
      let match = false;
      
      if (row.sn && String(row.sn).toLowerCase() === inputVal) match = true;
      else if (row.cid_lama && String(row.cid_lama).toLowerCase() === inputVal) match = true;
      else if (row.psn && String(row.psn).toLowerCase() === inputVal) match = true;
      
      if (match) {
        // Mainkan suara keberhasilan
        let audio = new Audio('https://www.soundjay.com/buttons/sounds/button-09.mp3');
        audio.play().catch(e => {});

        // Otomatis Pindah ke Baris 2 via API
        const btnVerifAction = document.getElementById('btnVerifModalAction');
        btnVerifAction.disabled = true;
        btnVerifAction.innerText = "⏳ Memproses Pindah...";

        fetch(SCRIPT_URL, {
          method: "POST",
          body: JSON.stringify({ 
            action: "mutasiData", 
            dariSheet: "Baris 1", 
            keSheet: "Baris 2", 
            teksCid: String(row.cid_lama) // PERBAIKAN: Memaksa format menjadi Teks/String
          })
        })
        .then(r => r.json())
        .then(res => {
          if(res.status === "success") {
             alert("✅ Data Valid! Berhasil diverifikasi dan otomatis dipindah ke Baris 2.");
             modalVerifInstance.hide();
             fetchData(); // Refresh ulang tabel untuk menghilangkan baris tersebut
          } else {
             alert("❌ Sistem Gagal Memindah: " + res.message);
          }
        })
        .catch(err => {
          alert("Gagal memindahkan data ke Baris 2 karena masalah koneksi.");
        })
        .finally(() => {
          btnVerifAction.disabled = false;
          btnVerifAction.innerText = "✔ Cocokkan & Pindah";
        });
        
      } else {
        alert("❌ DATA TIDAK SESUAI! \nInput yang dimasukkan tidak cocok dengan SN/CID di baris ini.");
        document.getElementById('inputModalVerif').value = "";
        document.getElementById('inputModalVerif').focus();
      }
    }

    // ============================================
    // KIRIM WHATSAPP (1 DATA & GABUNGAN) FORMAT RAPI
    // ============================================
    function kirimWASatu(index) {
      let row = globalDataList[index];
      let namaTS = row.ts || row.sales || "-"; 
      
      let teksWA = 
`Nama : ${row.nama_lama || "-"}
CID  : ${row.cid_lama || "-"}
ODP  : ${row.odp || "-"}
POP  : ${row.pop || "-"}
SN   : ${row.sn || "-"}
P-SN : ${row.psn || "-"}
KET  : ${row.keterangan || "-"}
TS   : ${namaTS}`;

      window.open(`https://wa.me/?text=${encodeURIComponent(teksWA)}`, '_blank');
    }

    function kirimWAGabungan() {
      let checkboxes = document.querySelectorAll('.row-check:checked');
      if (checkboxes.length === 0) return alert("Centang data yang ingin dikirim!");

      let teksWA = "";
      checkboxes.forEach((cb) => {
        let row = globalDataList[cb.value];
        let namaTS = row.ts || row.sales || "-";
        
        teksWA += 
`Nama : ${row.nama_lama || "-"}
CID  : ${row.cid_lama || "-"}
ODP  : ${row.odp || "-"}
POP  : ${row.pop || "-"}
SN   : ${row.sn || "-"}
P-SN : ${row.psn || "-"}
KET  : ${row.keterangan || "-"}
TS   : ${namaTS}\n\n`;
      });
      
      window.open(`https://wa.me/?text=${encodeURIComponent(teksWA.trim())}`, '_blank');
    }

    function searchTable() {
      let input = document.getElementById("searchInput").value.toLowerCase();
      let dateInput = document.getElementById("searchDate").value; 
      
      let trs = document.querySelectorAll("#tableBody tr");
      trs.forEach(tr => {
        if (!tr.id.startsWith("row-")) return; 
        
        let textRow = tr.innerText.toLowerCase();
        let dateCell = tr.cells[1] ? tr.cells[1].innerText : ""; 
        
        let matchText = textRow.includes(input);
        let matchDate = dateInput === "" || dateCell.includes(dateInput);
        
        tr.style.display = (matchText && matchDate) ? "" : "none";
      });
    }

    function logout() { localStorage.removeItem("user_session"); window.location.href = "login.html"; }

    window.onload = fetchData;
  </script>
</body>
</html>
