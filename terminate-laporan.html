<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Laporan Terminate - Sistem Terminate</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="auth.js"></script>
  <script src="menu-grup.js"></script>
  <script src="terminate-core.js"></script>
</head>
<body>
  <div class="container px-3 pt-3">
    <div class="card-custom p-3 mb-3">
      <div class="fw-bold text-white mb-1">📋 Laporan Harian Terminate </div>
      <div class="kecil mb-2">Satu laporan semua data pada tanggal itu. Centang data yang mau dimasukkan.</div>
      <div class="row g-2 mb-2"><div class="col-6"><label class="form-label small text-secondary mb-1">Dari</label><input type="date" id="tglLap" class="form-control form-control-dark"></div>
      <div class="col-6"><label class="form-label small text-secondary mb-1">Sampai</label><input type="date" id="tglSd" class="form-control form-control-dark"></div></div>
      <select id="scope" class="form-select form-select-dark mb-2"><option value="saya">Laporan saya</option></select>
      <label class="form-label small text-secondary fw-bold mb-1">Teman / anggota tim lain hari ini <span class="kecil">(opsional, masuk ke TIM dan TS)</span></label>
      <div id="temanBox"></div>
      <button type="button" id="btnTeman" class="btn btn-outline-info btn-sm mb-3">+ Tambah teman</button>
      <button id="btnBuat" class="btn btn-success w-100 fw-bold py-2">Buat Laporan</button>
      <div id="pesan" class="mt-2"></div>
    </div>
    <div id="hasil"></div>
  </div>
  <script>
    var S = TMC.init({ active: 'laporan', title: '📋 Laporan' });

    var $ = function (id) { return document.getElementById(id); };
    (function () { var d = new Date(); $('tglLap').value = $('tglSd').value = d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2); })();
    function pesan(t, j) { $('pesan').innerHTML = t ? '<div class="alert alert-' + j + ' py-2 mb-0 small">' + TMC.esc(t) + '</div>' : ''; }
    function foto(x) {
      var t = TMC.thumb(x.foto, 200);
      return t ? '<a href="' + TMC.esc(x.foto) + '" target="_blank" rel="noopener"><img class="thumb" src="' + TMC.esc(t) + '" alt="Foto"></a>' : '';
    }
    function kartu(x, extra) {
      return '<div class="card-custom p-3 mb-2"><div class="d-flex gap-3">' + foto(x) + '<div class="small flex-grow-1">' +
        '<div class="kecil">' + TMC.esc(x.waktu) + ' | <b class="text-info">' + TMC.esc(x.admin) + '</b> | ' + TMC.esc(x.jenis) + '</div>' +
        '<div><b>' + TMC.esc(x.nama || '(nama belum diisi)') + '</b> | CID: ' + TMC.esc(x.cid || '-') + '</div>' +
        (x.pop || x.odp ? '<div>POP: ' + TMC.esc(x.pop) + ' | ODP: ' + TMC.esc(x.odp) + '</div>' : '') +
        (x.sn || x.psn ? '<div>SN: ' + TMC.esc(x.sn || '-') + ' | P-SN: ' + TMC.esc(x.psn || '-') + '</div>' : '') +
        '<div class="kecil">Verif: ' + TMC.esc(x.verif || '-') + '</div>' + (extra || '') + '</div></div></div>';
    }
    function salin(t) {
      if (navigator.clipboard && navigator.clipboard.writeText) return navigator.clipboard.writeText(t);
      var a = document.createElement('textarea'); a.value = t; document.body.appendChild(a); a.select(); document.execCommand('copy'); a.remove(); return Promise.resolve();
    }


    // Pop up: wajib isi Nama TS & Nomor tujuan sebelum laporan dikirim lewat WhatsApp API
    var LS = 'lapkirim_';
    function ls(k) { try { return localStorage.getItem(LS + k) || ''; } catch (e) { return ''; } }
    function lsSet(k, v) { try { localStorage.setItem(LS + k, v); } catch (e) {} }
    function daftarLs(k, def) { try { var a = JSON.parse(ls(k) || '[]'); return a.length ? a : def; } catch (e) { return def; } }
    // pop-up: 1-10 nama TS dan 1-10 nomor tujuan (diingat di perangkat ini)
    function dialogKirim(l, tombol) {
      var no = daftarLs('nol', [ls('no')]);
      var ov = document.createElement('div');
      ov.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:4000;display:flex;align-items:center;justify-content:center;padding:14px';
      ov.innerHTML = '<div class="card-custom p-3" style="width:100%;max-width:420px;max-height:92vh;overflow:auto">' +
        '<div class="fw-bold text-white mb-1">📤 Kirim Laporan</div><div class="kecil mb-3">' + (l.teksList ? l.teksList.length + ' pesan, 1 data 1 pesan + foto. ' : '1 pesan laporan gabungan. ') + 'Lewat WhatsApp API. Isi 1 sampai 10 nomor tujuan.</div>' +
        '<label class="form-label small text-secondary fw-bold mb-1">Tujuan tersimpan</label><div class="d-flex gap-1 mb-2"><select id="dDaftar" class="form-select form-select-dark"><option value="">- pilih nama -</option></select><button class="btn btn-outline-danger btn-sm" id="dHapus" title="Hapus dari daftar">🗑</button></div>' +
        (l.teksList ? '<label class="small d-block mb-2"><input type="checkbox" id="dTautan"> Sertakan tautan foto di teks (kalau gambar tidak muncul)</label>' : '') +
        '<label class="form-label small text-secondary fw-bold mb-1">Nomor tujuan * <span class="fw-normal">(08xx / 628xx / ID grup @g.us)</span></label><div id="dNo"></div><button class="btn btn-outline-info btn-sm mb-2" id="dNoT">+ Tambah nomor</button> <button class="btn btn-outline-success btn-sm mb-2" id="dSimpan">💾 Simpan nomor dengan nama</button>' +
        '<div id="dMsg"></div>' +
        '<div class="d-flex gap-2"><button class="btn btn-outline-light fw-bold flex-fill" id="dBatal">Batal</button><button class="btn btn-success fw-bold flex-fill" id="dKirim">Kirim</button></div></div>';
      document.body.appendChild(ov);
      var m = function (t, j) { ov.querySelector('#dMsg').innerHTML = t ? '<div class="alert alert-' + j + ' py-2 small">' + esc2(t) + '</div>' : ''; };
      function ambil() { [['#dNo', no]].forEach(function (p) { Array.prototype.forEach.call(ov.querySelectorAll(p[0] + ' input'), function (e) { p[1][e.getAttribute('data-i')] = e.value; }); }); }
      function gambar() {
        ambil();
        [['#dNo', no, '08xx… atau 1203…@g.us', 'tel']].forEach(function (p) {
          ov.querySelector(p[0]).innerHTML = p[1].map(function (v, i) {
            return '<div class="d-flex gap-1 mb-1"><input class="form-control form-control-dark" data-i="' + i + '" inputmode="' + p[3] + '" placeholder="' + p[2] + '" value="' + esc2(v) + '">' +
              (p[1].length > 1 ? '<button class="btn btn-outline-danger btn-sm" data-x="' + i + '" data-l="' + p[0] + '">✕</button>' : '') + '</div>';
          }).join('');
        });
      }
      gambar();
      var tersimpan = [];
      function isiDaftar() { var s = ov.querySelector('#dDaftar'); s.innerHTML = '<option value="">- pilih nama -</option>' + tersimpan.map(function (x, i) { return '<option value="' + i + '">' + esc2(x.nama) + ' (' + esc2(x.nomor) + ')</option>'; }).join(''); }
      TMC.api('terminateTujuanBaca').then(function (r) { if (r && r.status === 'success') { tersimpan = r.data || []; isiDaftar(); } }).catch(function () {});
      ov.querySelector('#dDaftar').onchange = function () {
        var x = tersimpan[this.value]; if (!x) return; ambil();
        var k = no.indexOf(''); if (k >= 0) no[k] = x.nomor; else if (no.indexOf(x.nomor) < 0 && no.length < 10) no.push(x.nomor); gambar(); this.value = '';
      };
      ov.querySelector('#dHapus').onclick = function () {
        var s = ov.querySelector('#dDaftar'), x = tersimpan[s.value]; if (!x) return m('Pilih nama yang mau dihapus dulu.', 'warning');
        if (!confirm('Hapus "' + x.nama + '" dari daftar?')) return;
        TMC.api('terminateTujuanHapus', { nama: x.nama }).then(function (r) { if (r.status === 'success') { tersimpan = r.data; isiDaftar(); } });
      };
      ov.querySelector('#dSimpan').onclick = function () {
        ambil(); var isi = no.map(function (v) { return v.trim(); }).filter(Boolean);
        if (!isi.length) return m('Isi nomor / ID grup dulu.', 'warning');
        var nama = prompt('Nama untuk ' + isi[0] + ' (mis. Grup Terminate Medan):'); if (!nama) return;
        TMC.api('terminateTujuanSimpan', { nama: nama, nomor: isi[0] }).then(function (r) { if (r.status === 'success') { tersimpan = r.data; isiDaftar(); m(r.message, 'success'); } else m(r.message, 'danger'); });
      };
      ov.querySelector('#dNoT').onclick = function () { ambil(); if (no.length < 10) no.push(''); gambar(); };
      ov.addEventListener('click', function (e) { var x = e.target.getAttribute && e.target.getAttribute('data-x'); if (x == null) return; ambil(); no.splice(+x, 1); gambar(); });
      ov.querySelector('#dBatal').onclick = function () { ov.remove(); };
      ov.querySelector('#dKirim').onclick = function () {
        ambil();
        var n = no.map(function (v) { return v.trim(); }).filter(Boolean);
        if (!n.length) return m('Nomor tujuan wajib diisi (minimal 1).', 'warning');
        var bt = ov.querySelector('#dKirim'); bt.disabled = true; bt.textContent = 'Mengirim...'; m('', '');
        TMC.api('terminateKirimLaporan', { teks: l.teksList || l.teks, foto: l.fotoList || [], nomor: n, tautan: !!(ov.querySelector('#dTautan') && ov.querySelector('#dTautan').checked) }).then(function (r) {
          if (r.status === 'success') { lsSet('nol', JSON.stringify(n)); tombol.textContent = 'Terkirim ✔'; ov.remove(); if (r.hasil && r.hasil.gagal.length) alert(r.message); }
          else { m(r.message, 'danger'); bt.disabled = false; bt.textContent = 'Kirim'; }
        }).catch(function () { m('Gagal terhubung ke server.', 'danger'); bt.disabled = false; bt.textContent = 'Kirim'; });
      };
    }
    function esc2(x) { return String(x == null ? '' : x).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }

    if (S.role === 'ADMIN') {
      var o = document.createElement('option'); o.value = 'gabungan'; o.textContent = 'Laporan GABUNGAN (semua sub admin)'; $('scope').appendChild(o);
      TMC.api('terminateOptions').then(function (r) {
        (r.users || []).forEach(function (u) { var x = document.createElement('option'); x.value = u; x.textContent = 'Laporan: ' + u; $('scope').appendChild(x); });
      });
    }
    // Teman diisi saat membuat laporan; diingat di perangkat ini supaya tidak mengetik ulang
    function tambahTeman(v) {
      var r = document.createElement('div'); r.className = 'd-flex gap-1 mb-1';
      r.innerHTML = '<input class="form-control form-control-dark" data-teman placeholder="Nama teman">' +
        '<button type="button" class="btn btn-outline-danger btn-sm" aria-label="Hapus teman">✕</button>';
      r.querySelector('input').value = v || '';
      r.querySelector('button').onclick = function () { r.remove(); };
      $('temanBox').appendChild(r);
    }
    function daftarTeman() {
      var a = []; Array.prototype.forEach.call(document.querySelectorAll('[data-teman]'), function (e) { if (e.value.trim()) a.push(e.value.trim()); });
      try { localStorage.setItem('tm_teman_' + S.user, JSON.stringify(a)); } catch (e) {}
      return a;
    }
    $('btnTeman').onclick = function () { tambahTeman(''); };
    try { JSON.parse(localStorage.getItem('tm_teman_' + S.user) || '[]').slice(0, 10).forEach(tambahTeman); } catch (e) {}
    var DATA = [], TGL = '';
    var JUDUL = { TERMINATE: 'CLIENT YANG BERHENTI BERLANGGANAN DAN PERANGKAT SUDAH DIAMBIL.', LANJUT: 'CLIENT YANG MASIH LANJUT BERLANGGANAN DAN SUDAH BAYAR', KUNJUNGAN: 'CLIENT TIDAK ADA DIRUMAH' };
    function terpilih() { var a = []; Array.prototype.forEach.call(document.querySelectorAll('[data-pilih]:checked'), function (e) { a.push(DATA[+e.getAttribute('data-pilih')]); }); return a; }
    // satu laporan gabungan dari data yang dicentang
    function susun(arr) {
      if (!arr.length) return '';
      var tim = []; arr.forEach(function (x) { (x.timList || []).forEach(function (n) { n = n.toUpperCase(); if (tim.indexOf(n) < 0) tim.push(n); }); });
      var p = ['LAPORAN HARIAN TERMINATE', TGL, 'TIM :\n' + tim.join('\n')];
      ['TERMINATE', 'LANJUT', 'KUNJUNGAN'].forEach(function (j) {
        var g = arr.filter(function (x) { return x.jenis === j; });
        if (g.length) p.push('*' + JUDUL[j] + '*\n\n' + g.map(function (x, i) { return (i + 1) + '.' + x.blok; }).join('\n\n'));
      });
      p.push('LANJUT.'); return p.join('\n\n');
    }
    function segarkan() {
      var a = terpilih(), t = susun(a);
      $('lapTeks').value = t; $('jml').textContent = a.length + ' dari ' + DATA.length + ' data dipilih';
      $('cekSemua').checked = a.length === DATA.length && a.length > 0;
      ['bSalin', 'bGab', 'bPer', 'bWa'].forEach(function (i) { if ($(i)) $(i).disabled = !a.length; });
    }
    $('btnBuat').onclick = function () {
      var b = $('btnBuat'); b.disabled = true; pesan('Menyusun laporan...', 'secondary'); $('hasil').innerHTML = '';
      TMC.api('terminateRekap', { scope: $('scope').value, dari: $('tglLap').value, sampai: $('tglSd').value || $('tglLap').value, teman: daftarTeman() }).then(function (r) {
        if (r.status !== 'success') { pesan(r.message, 'warning'); return; }
        pesan('', ''); DATA = r.data || []; TGL = r.tanggal;
        var adm = Auth.can('TCHAT');
        var c = document.createElement('div'); c.className = 'card-custom p-3 mb-3';
        c.innerHTML = '<div class="d-flex justify-content-between align-items-center mb-2"><div class="small text-info fw-bold">Laporan ' + esc2(TGL) + '</div><label class="small"><input type="checkbox" id="cekSemua" checked> Pilih semua</label></div>' +
          '<div id="jml" class="kecil mb-2"></div><div id="daftar"></div>' +
          '<textarea id="lapTeks" class="form-control form-control-dark mt-2" rows="14" readonly></textarea>' +
          '<div class="d-flex gap-2 mt-2 flex-wrap"><button id="bSalin" class="btn btn-info btn-sm fw-bold flex-fill">Salin laporan</button>' +
          (adm ? '<button id="bGab" class="btn btn-success btn-sm fw-bold flex-fill">Kirim via WA API (1 pesan)</button><button id="bPer" class="btn btn-warning btn-sm fw-bold flex-fill">1 data 1 pesan + foto</button>' : '<a id="bWa" class="btn btn-success btn-sm fw-bold flex-fill" target="_blank" rel="noopener">Kirim WhatsApp</a>') + '</div>';
        $('hasil').appendChild(c);
        DATA.forEach(function (x, i) {
          var k = document.createElement('div'); k.innerHTML = kartu(x, '<button type="button" class="btn btn-outline-info btn-sm mt-1" data-salin="1">Salin data ini</button>');
          var card = k.firstChild, tb = card.querySelector('[data-salin]');
          tb.onclick = function () { salin(x.caption).then(function () { tb.textContent = 'Tersalin ✔'; }); };
          var cb = document.createElement('input'); cb.type = 'checkbox'; cb.checked = true; cb.setAttribute('data-pilih', i); cb.style.cssText = 'width:20px;height:20px;margin-top:4px';
          cb.onchange = segarkan; card.querySelector('.d-flex').insertBefore(cb, card.querySelector('.d-flex').firstChild);
          $('daftar').appendChild(card);
        });
        $('cekSemua').onchange = function () { var v = this.checked; Array.prototype.forEach.call(document.querySelectorAll('[data-pilih]'), function (e) { e.checked = v; }); segarkan(); };
        $('bSalin').onclick = function () { salin($('lapTeks').value).then(function () { $('bSalin').textContent = 'Tersalin ✔'; }); };
        if (adm) {
          $('bGab').onclick = function () { dialogKirim({ teks: $('lapTeks').value }, $('bGab')); };
          $('bPer').onclick = function () { var a = terpilih(); dialogKirim({ teksList: a.map(function (x) { return x.caption; }), fotoList: a.map(function (x) { return x.foto || ''; }) }, $('bPer')); };
        } else $('bWa').onclick = function () { $('bWa').href = 'https://wa.me/?text=' + encodeURIComponent($('lapTeks').value); };
        segarkan();
      }).catch(function () { pesan('Gagal terhubung ke server.', 'danger'); }).finally(function () { b.disabled = false; });
    };
  </script>
</body>
</html>
