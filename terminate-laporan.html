<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Laporan Terminate - Sistem Terminate</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="auth.js"></script>
  <script src="menu-grup.js"></script>
  <script src="terminate-core.js"></script>
</head>
<body>
  <div class="container px-3 pt-3">
    <div class="card-custom p-3 mb-3">
      <div class="fw-bold text-white mb-1">📋 Laporan Harian Terminate </div>
      <div class="kecil mb-2">Dipisah per POP: PERBAUNGAN dan PANTAI CERMIN.</div>
      <label class="form-label small text-secondary fw-bold mb-1">Tanggal laporan</label>
      <input type="date" id="tglLap" class="form-control form-control-dark mb-2">
      <select id="scope" class="form-select form-select-dark mb-2"><option value="saya">Laporan saya</option></select>
      <label class="form-label small text-secondary fw-bold mb-1">Teman / anggota tim lain hari ini <span class="kecil">(opsional, masuk ke TIM dan TS)</span></label>
      <div id="temanBox"></div>
      <button type="button" id="btnTeman" class="btn btn-outline-info btn-sm mb-3">+ Tambah teman</button>
      <button id="btnBuat" class="btn btn-success w-100 fw-bold py-2">Buat Laporan</button>
      <div id="pesan" class="mt-2"></div>
    </div>
    <div id="hasil"></div>
  </div>
  <script>
    var S = TMC.init({ active: 'laporan', title: '📋 Laporan' });

    var $ = function (id) { return document.getElementById(id); };
    (function () { var d = new Date(); $('tglLap').value = d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2); })();
    function pesan(t, j) { $('pesan').innerHTML = t ? '<div class="alert alert-' + j + ' py-2 mb-0 small">' + TMC.esc(t) + '</div>' : ''; }
    function foto(x) {
      var t = TMC.thumb(x.foto, 200);
      return t ? '<a href="' + TMC.esc(x.foto) + '" target="_blank" rel="noopener"><img class="thumb" src="' + TMC.esc(t) + '" alt="Foto"></a>' : '';
    }
    function kartu(x, extra) {
      return '<div class="card-custom p-3 mb-2"><div class="d-flex gap-3">' + foto(x) + '<div class="small flex-grow-1">' +
        '<div class="kecil">' + TMC.esc(x.waktu) + ' | <b class="text-info">' + TMC.esc(x.admin) + '</b> | ' + TMC.esc(x.jenis) + '</div>' +
        '<div><b>' + TMC.esc(x.nama || '(nama belum diisi)') + '</b> | CID: ' + TMC.esc(x.cid || '-') + '</div>' +
        '<div>POP: ' + TMC.esc(x.pop) + ' | ODP: ' + TMC.esc(x.odp) + '</div>' +
        (x.sn || x.psn ? '<div>SN: ' + TMC.esc(x.sn || '-') + ' | P-SN: ' + TMC.esc(x.psn || '-') + '</div>' : '') +
        '<div class="kecil">Verif: ' + TMC.esc(x.verif || '-') + '</div>' + (extra || '') + '</div></div></div>';
    }
    function salin(t) {
      if (navigator.clipboard && navigator.clipboard.writeText) return navigator.clipboard.writeText(t);
      var a = document.createElement('textarea'); a.value = t; document.body.appendChild(a); a.select(); document.execCommand('copy'); a.remove(); return Promise.resolve();
    }


    // Pop up: wajib isi Nama TS & Nomor tujuan sebelum laporan dikirim lewat WhatsApp API
    var LS = 'lapkirim_';
    function ls(k) { try { return localStorage.getItem(LS + k) || ''; } catch (e) { return ''; } }
    function lsSet(k, v) { try { localStorage.setItem(LS + k, v); } catch (e) {} }
    function daftarLs(k, def) { try { var a = JSON.parse(ls(k) || '[]'); return a.length ? a : def; } catch (e) { return def; } }
    // pop-up: 1-10 nama TS dan 1-10 nomor tujuan (diingat di perangkat ini)
    function dialogKirim(l, tombol) {
      var ts = daftarLs('tsl', [ls('ts')]), no = daftarLs('nol', [ls('no')]);
      var ov = document.createElement('div');
      ov.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:4000;display:flex;align-items:center;justify-content:center;padding:14px';
      ov.innerHTML = '<div class="card-custom p-3" style="width:100%;max-width:420px;max-height:92vh;overflow:auto">' +
        '<div class="fw-bold text-white mb-1">📤 Kirim Laporan ' + esc2(l.pop) + '</div><div class="kecil mb-3">' + (l.teksList ? l.teksList.length + ' pesan, 1 data 1 pesan + foto. ' : '') + 'Lewat WhatsApp API. Isi 1 sampai 10 nama TS dan 1 sampai 10 nomor tujuan.</div>' +
        '<label class="form-label small text-secondary fw-bold mb-1">Nama TS *</label><div id="dTs"></div><button class="btn btn-outline-info btn-sm mb-3" id="dTsT">+ Tambah TS</button>' +
        '<label class="form-label small text-secondary fw-bold mb-1">Nomor tujuan * <span class="fw-normal">(08xx / 628xx / ID grup @g.us)</span></label><div id="dNo"></div><button class="btn btn-outline-info btn-sm mb-2" id="dNoT">+ Tambah nomor</button>' +
        '<div id="dMsg"></div>' +
        '<div class="d-flex gap-2"><button class="btn btn-outline-light fw-bold flex-fill" id="dBatal">Batal</button><button class="btn btn-success fw-bold flex-fill" id="dKirim">Kirim</button></div></div>';
      document.body.appendChild(ov);
      var m = function (t, j) { ov.querySelector('#dMsg').innerHTML = t ? '<div class="alert alert-' + j + ' py-2 small">' + esc2(t) + '</div>' : ''; };
      function ambil() { [['#dTs', ts], ['#dNo', no]].forEach(function (p) { Array.prototype.forEach.call(ov.querySelectorAll(p[0] + ' input'), function (e) { p[1][e.getAttribute('data-i')] = e.value; }); }); }
      function gambar() {
        ambil();
        [['#dTs', ts, 'Nama TS', 'text'], ['#dNo', no, '08xx… atau 1203…@g.us', 'tel']].forEach(function (p) {
          ov.querySelector(p[0]).innerHTML = p[1].map(function (v, i) {
            return '<div class="d-flex gap-1 mb-1"><input class="form-control form-control-dark" data-i="' + i + '" inputmode="' + p[3] + '" placeholder="' + p[2] + '" value="' + esc2(v) + '">' +
              (p[1].length > 1 ? '<button class="btn btn-outline-danger btn-sm" data-x="' + i + '" data-l="' + p[0] + '">✕</button>' : '') + '</div>';
          }).join('');
        });
      }
      gambar();
      ov.querySelector('#dTsT').onclick = function () { ambil(); if (ts.length < 10) ts.push(''); gambar(); };
      ov.querySelector('#dNoT').onclick = function () { ambil(); if (no.length < 10) no.push(''); gambar(); };
      ov.addEventListener('click', function (e) { var x = e.target.getAttribute && e.target.getAttribute('data-x'); if (x == null) return; ambil(); (e.target.getAttribute('data-l') === '#dTs' ? ts : no).splice(+x, 1); gambar(); });
      ov.querySelector('#dBatal').onclick = function () { ov.remove(); };
      ov.querySelector('#dKirim').onclick = function () {
        ambil();
        var t = ts.map(function (v) { return v.trim(); }).filter(Boolean), n = no.map(function (v) { return v.trim(); }).filter(Boolean);
        if (!t.length) return m('Nama TS wajib diisi (minimal 1).', 'warning');
        if (!n.length) return m('Nomor tujuan wajib diisi (minimal 1).', 'warning');
        var bt = ov.querySelector('#dKirim'); bt.disabled = true; bt.textContent = 'Mengirim...'; m('', '');
        TMC.api('terminateKirimLaporan', { teks: l.teksList || l.teks, foto: l.fotoList || [], ts: t, nomor: n }).then(function (r) {
          if (r.status === 'success') { lsSet('tsl', JSON.stringify(t)); lsSet('nol', JSON.stringify(n)); tombol.textContent = 'Terkirim ✔'; ov.remove(); if (r.hasil && r.hasil.gagal.length) alert(r.message); }
          else { m(r.message, 'danger'); bt.disabled = false; bt.textContent = 'Kirim'; }
        }).catch(function () { m('Gagal terhubung ke server.', 'danger'); bt.disabled = false; bt.textContent = 'Kirim'; });
      };
    }
    function esc2(x) { return String(x == null ? '' : x).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }

    if (S.role === 'ADMIN') {
      var o = document.createElement('option'); o.value = 'gabungan'; o.textContent = 'Laporan GABUNGAN (semua sub admin)'; $('scope').appendChild(o);
      TMC.api('terminateOptions').then(function (r) {
        (r.users || []).forEach(function (u) { var x = document.createElement('option'); x.value = u; x.textContent = 'Laporan: ' + u; $('scope').appendChild(x); });
      });
    }
    // Teman diisi saat membuat laporan; diingat di perangkat ini supaya tidak mengetik ulang
    function tambahTeman(v) {
      var r = document.createElement('div'); r.className = 'd-flex gap-1 mb-1';
      r.innerHTML = '<input class="form-control form-control-dark" data-teman placeholder="Nama teman">' +
        '<button type="button" class="btn btn-outline-danger btn-sm" aria-label="Hapus teman">✕</button>';
      r.querySelector('input').value = v || '';
      r.querySelector('button').onclick = function () { r.remove(); };
      $('temanBox').appendChild(r);
    }
    function daftarTeman() {
      var a = []; Array.prototype.forEach.call(document.querySelectorAll('[data-teman]'), function (e) { if (e.value.trim()) a.push(e.value.trim()); });
      try { localStorage.setItem('tm_teman_' + S.user, JSON.stringify(a)); } catch (e) {}
      return a;
    }
    $('btnTeman').onclick = function () { tambahTeman(''); };
    try { JSON.parse(localStorage.getItem('tm_teman_' + S.user) || '[]').slice(0, 10).forEach(tambahTeman); } catch (e) {}
    $('btnBuat').onclick = function () {
      var b = $('btnBuat'); b.disabled = true; pesan('Menyusun laporan...', 'secondary'); $('hasil').innerHTML = '';
      TMC.api('terminateRekap', { scope: $('scope').value, tanggal: $('tglLap').value, teman: daftarTeman() }).then(function (r) {
        if (r.status !== 'success') { pesan(r.message, 'warning'); return; }
        pesan('', '');
        var semua = []; r.laporan.forEach(function (l) { (l.data || []).forEach(function (x) { semua.push(x); }); });
        function perData(label, arr, btn) { dialogKirim({ pop: label, teksList: arr.map(function (x) { return x.teks; }), fotoList: arr.map(function (x) { return x.foto || ''; }) }, btn); }
        if (r.laporan.length >= 1) {          // gabungan: PERBAUNGAN + PANTAI CERMIN pada tanggal terpilih
          var gt = r.laporan.map(function (l) { return l.teks; }).join('\n\n━━━━━━━━━━\n\n'), g = document.createElement('div'); g.className = 'card-custom p-3 mb-3';
          g.innerHTML = '<div class="small text-info fw-bold mb-2">Gabungan PERBAUNGAN + PANTAI CERMIN, ' + esc2(r.tanggal) + ' (' + semua.length + ' data)</div>';
          var gr = document.createElement('div'); gr.className = 'd-flex gap-2';
          var g1 = document.createElement('button'); g1.className = 'btn btn-info btn-sm fw-bold flex-fill'; g1.textContent = 'Salin gabungan';
          g1.onclick = function () { salin(gt).then(function () { g1.textContent = 'Tersalin ✔'; }); };
          var g2 = Auth.can('TCHAT') ? document.createElement('button') : document.createElement('a'); g2.className = 'btn btn-success btn-sm fw-bold flex-fill'; g2.textContent = Auth.can('TCHAT') ? 'Kirim gabungan via WA API' : 'Kirim gabungan WhatsApp';
          if (Auth.can('TCHAT')) g2.onclick = function () { dialogKirim({ pop: 'GABUNGAN', teks: gt }, g2); }; else { g2.target = '_blank'; g2.rel = 'noopener'; g2.href = 'https://wa.me/?text=' + encodeURIComponent(gt); }
          gr.appendChild(g1); gr.appendChild(g2);
          if (Auth.can('TCHAT')) { var g3 = document.createElement('button'); g3.className = 'btn btn-warning btn-sm fw-bold flex-fill'; g3.textContent = 'Kirim 1 data 1 pesan + foto (' + semua.length + ')'; g3.onclick = function () { perData('GABUNGAN', semua, g3); }; gr.appendChild(g3); }
          g.appendChild(gr); $('hasil').appendChild(g);
        }
        r.laporan.forEach(function (l) {
          var c = document.createElement('div'); c.className = 'card-custom p-3 mb-3';
          var h = document.createElement('div'); h.className = 'small text-info fw-bold mb-2';
          h.textContent = l.pop + ' - ' + l.jumlah.terminate + ' diambil, ' + l.jumlah.lanjut + ' lanjut, ' + l.jumlah.kunjungan + ' tidak ada di rumah';
          var ta = document.createElement('textarea'); ta.className = 'form-control form-control-dark'; ta.rows = 14; ta.readOnly = true; ta.value = l.teks;
          var row = document.createElement('div'); row.className = 'd-flex gap-2 mt-2';
          var b1 = document.createElement('button'); b1.className = 'btn btn-info btn-sm fw-bold flex-fill'; b1.textContent = 'Salin';
          b1.onclick = function () { salin(l.teks).then(function () { b1.textContent = 'Tersalin ✔'; }); };
          var b2;
          if (Auth.can('TCHAT')) {          // admin: laporan dikirim lewat WhatsApp API (tujuan diatur di sistem)
            b2 = document.createElement('button'); b2.className = 'btn btn-success btn-sm fw-bold flex-fill'; b2.textContent = 'Kirim via WA API';
            b2.onclick = function () { dialogKirim(l, b2); };
          } else {
            b2 = document.createElement('a'); b2.className = 'btn btn-success btn-sm fw-bold flex-fill'; b2.textContent = 'Kirim WhatsApp';
            b2.target = '_blank'; b2.rel = 'noopener'; b2.href = 'https://wa.me/?text=' + encodeURIComponent(l.teks);
          }
          row.appendChild(b1); row.appendChild(b2);
          if (Auth.can('TCHAT')) { var b3 = document.createElement('button'); b3.className = 'btn btn-warning btn-sm fw-bold flex-fill'; b3.textContent = '1 data 1 pesan + foto'; b3.onclick = function () { perData(l.pop, l.data || [], b3); }; row.appendChild(b3); }
          c.appendChild(h); c.appendChild(ta); c.appendChild(row);
          // Laporan per data + foto: tiap data punya foto & teks sendiri (salin / kirim satu per satu)
          var dh = document.createElement('div'); dh.className = 'small text-info fw-bold mt-3 mb-2'; dh.textContent = 'Per data + foto (' + (l.data || []).length + ')'; c.appendChild(dh);
          (l.data || []).forEach(function (x) {
            var k = document.createElement('div'); k.innerHTML = kartu(x, '<button type="button" class="btn btn-outline-info btn-sm mt-1" data-salin="1">Salin laporan data ini</button>');
            var tb = k.querySelector('[data-salin]'); tb.onclick = function () { salin(x.teks).then(function () { tb.textContent = 'Tersalin ✔'; }); };
            c.appendChild(k.firstChild);
          });
          $('hasil').appendChild(c);
        });
      }).catch(function () { pesan('Gagal terhubung ke server.', 'danger'); }).finally(function () { b.disabled = false; });
    };
  </script>
</body>
</html>
