<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profil Saya - Sistem Lapangan</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body{background:#0b132b;color:#e0e6ed;font-family:'Segoe UI',sans-serif;margin:0;padding-bottom:40px}
    .top{background:#1c2541;padding:12px 16px;border-bottom:1px solid #2a385b;display:flex;justify-content:space-between;align-items:center;gap:8px}
    .kartu{background:#1c2541;border:1px solid #2a385b;border-radius:12px}
    .kecil{font-size:.78rem;color:#94a3b8}
    .fd{background:#0b132b;border:1px solid #3a506b;color:#fff;font-size:.9rem}
    .fd:focus{background:#0b132b;color:#fff;border-color:#38bdf8;box-shadow:none}
    .fd::placeholder{color:#64748b}
    .av{width:64px;height:64px;border-radius:50%;background:linear-gradient(135deg,#38bdf8,#2563eb);color:#fff;display:flex;align-items:center;justify-content:center;font-size:1.7rem;font-weight:700;flex:none}
    .chip{display:inline-block;background:#0b132b;border:1px solid #3a506b;border-radius:999px;padding:2px 10px;font-size:.75rem;margin:0 4px 4px 0;color:#cbd5e1}
  </style>
  <script src="auth.js"></script>
  <script src="menu-grup.js"></script>
</head>
<body>
  <div class="top">
    <div class="fw-bold text-white">🪪 Profil Saya</div>
    <div class="d-flex align-items-center gap-2"><a id="kembali" href="index.html" class="btn btn-sm btn-outline-light py-0">← Kembali</a></div>
  </div>

  <div class="container px-3 pt-3" style="max-width:560px">
    <div class="kartu p-3 mb-3">
      <div class="d-flex gap-3 align-items-center">
        <div class="av" id="av">?</div>
        <div>
          <div class="fw-bold text-white fs-5" id="nama"></div>
          <div class="kecil" id="info"></div>
          <div class="kecil" id="sesi"></div>
        </div>
      </div>
    </div>

    <div class="kartu p-3 mb-3">
      <div class="fw-bold text-white mb-2">Halaman yang boleh diakses</div>
      <div id="izin"></div>
    </div>

    <div class="kartu p-3 mb-3">
      <div class="fw-bold text-white mb-2">Ganti Password</div>
      <input id="pw1" type="password" class="form-control fd mb-2" placeholder="Password lama" autocomplete="current-password">
      <input id="pw2" type="password" class="form-control fd mb-2" placeholder="Password baru (min. 6 karakter)" autocomplete="new-password">
      <input id="pw3" type="password" class="form-control fd mb-2" placeholder="Ulangi password baru" autocomplete="new-password">
      <button id="btnSimpan" class="btn btn-info w-100 fw-bold">Simpan Password</button>
      <div id="pesan" class="mt-2"></div>
    </div>

    <div class="kartu p-3 mb-3" id="kotakApi" style="display:none">
      <div class="fw-bold text-white mb-1">Pengaturan API (khusus admin tertinggi)</div>
      <div class="kecil mb-2">Isi token WhatsApp, Telegram, dan API key bot AI tanpa membuka Apps Script.</div>
      <a href="pengaturan-api.html" class="btn btn-warning w-100 fw-bold">⚙️ Masuk &amp; Atur API</a>
    </div>

    <button id="btnKeluar" class="btn btn-danger w-100 fw-bold">⎋ Keluar</button>
  </div>

  <script>
    var SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzsS4-LPktyuUKoC6Cf6TERV498wqvm31frvD7-W0gFhrCb9fkgwVBjAHeLrEeVMd25/exec";
    var S = Auth.guard();
    if (S.role !== "ADMIN") { location.replace(Auth.home()); throw new Error("admin"); }   // Profil & fitur admin: khusus admin
    var user = S.username || "?", iz = S.izin || {};
    var NAMA = { TINPUT: "Input Terminate", TDIAMBIL: "Perangkat Diambil", TEDIT: "Edit Data", TLAPORAN: "Laporan Terminate", TDATA: "Data Penuh",
      TIMPOR: "Impor & Bersihkan Data", TCHAT: "Chat Client", TAPI: "Pengaturan API (admin tertinggi)", DASHBOARD: "Dashboard Admin", FORMINPUT: "Form Input", DATAADMIN: "Data Admin", MANAJEMENAKUN: "Manajemen Akun" };
    function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
    document.getElementById("av").textContent = user.charAt(0).toUpperCase();
    document.getElementById("nama").textContent = S.nama || user;
    document.getElementById("info").textContent = "@" + user + " · " + (S.role === "ADMIN" ? "ADMIN" : (S.role ? "SUB ADMIN" : "USER"));
    document.getElementById("sesi").textContent = "Sesi berakhir " + new Date(S.exp).toLocaleString("id-ID");
    document.getElementById("izin").innerHTML = Object.keys(NAMA).filter(function (k) { return iz[k]; })
      .map(function (k) { return '<span class="chip">' + NAMA[k] + "</span>"; }).join("") || '<span class="kecil">Belum ada izin halaman.</span>';
    document.getElementById("kembali").href = Auth.home();
    if (S.role === "ADMIN" && Auth.can("TAPI")) document.getElementById("kotakApi").style.display = "";
    document.getElementById("btnKeluar").onclick = function () { Auth.logout(); };

    function h(t, j) { document.getElementById("pesan").innerHTML = '<div class="alert alert-' + j + ' py-2 mb-0 small">' + esc(t) + "</div>"; }
    document.getElementById("btnSimpan").onclick = function () {
      var btn = this, a = pw1.value, b = pw2.value, c = pw3.value;
      if (!a || !b) return h("Isi password lama dan baru.", "warning");
      if (b.length < 6) return h("Password baru minimal 6 karakter.", "warning");
      if (b !== c) return h("Ulangi password baru tidak sama.", "warning");
      btn.disabled = true; h("Menyimpan...", "secondary");
      fetch(SCRIPT_URL, { method: "POST", body: JSON.stringify({ action: "terminateGantiPassword", token: S.token, lama: a, baru: b }) })
        .then(function (r) { return r.json(); })
        .then(function (r) {
          if (r && r.code === "SESSION") return Auth.logout(r.message);
          if (!r || r.tm !== 1) return h("Backend (Apps Script) belum diperbarui. Tempel Terminate.gs terbaru, lalu Deploy > New version.", "danger");
          h(r.message || "Selesai.", r.status === "success" ? "success" : "danger");
          if (r.status === "success") pw1.value = pw2.value = pw3.value = "";
        })
        .catch(function () { h("Gagal terhubung ke server.", "danger"); })
        .finally(function () { btn.disabled = false; });
    };
  </script>
</body>
</html>
