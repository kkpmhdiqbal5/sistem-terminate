<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Input Terminate - Sistem Lapangan</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="auth.js"></script>
  <script src="menu-grup.js"></script>
  <script src="terminate-core.js"></script>
</head>
<body>
  <div class="container px-3 pt-3">
    <div class="card-custom p-3 mb-3">
      <label class="form-label small text-info fw-bold">JENIS LAPORAN</label>
      <select id="jenis" class="form-select form-select-dark mb-3">
        <option value="TERMINATE">📦 Perangkat Terminate (sudah diambil)</option>
        <option value="KUNJUNGAN">🏠 Client Tidak Ada di Rumah</option>
        <option value="LANJUT">✅ Lanjut Berlangganan</option>
      </select>

      <div id="aiBox" class="mb-3 p-2 border border-info rounded d-none">
        <label class="form-label small text-info fw-bold mb-1">✨ ISI DENGAN AI</label>
        <textarea id="aiTeks" class="form-control form-control-dark" rows="3" placeholder="Tempel pesan / catatan, AI mengisi POP, ODP, SN, P-SN, Nama, CID"></textarea>
        <button type="button" id="aiBtn" class="btn btn-sm btn-info fw-bold mt-2">Isi kolom otomatis</button> <span id="aiMsg" class="kecil"></span>
      </div>

      <div class="mb-3" id="blokFoto">
        <label id="lblFoto" class="form-label small text-info fw-bold">Foto Perangkat *</label>
        <div><button type="button" id="btnFoto" class="btn btn-primary btn-sm fw-bold">📷 Ambil Foto (Kamera)</button>
          <span class="kecil ms-2">Foto langsung dari kamera, galeri tidak bisa dipakai.</span></div>
        <img id="prev" class="img-fluid rounded mt-2 d-none" style="max-height:220px;object-fit:cover" alt="Foto">
      </div>

      <div class="row g-2 mb-2">
        <div class="col-12 col-md-6">
          <label class="form-label small text-secondary fw-bold mb-1">POP *</label>
          <select id="pop" class="form-select form-select-dark">
            <option value="">-- Pilih POP --</option>
            <option value="PERBAUNGAN">PERBAUNGAN</option>
            <option value="PANTAI CERMIN">PANTAI CERMIN</option>
          </select>
        </div>
        <div class="col-12 col-md-6">
          <label class="form-label small text-secondary fw-bold mb-1">ODP * <span class="kecil">(sesuai POP)</span></label>
          <input id="odp" list="odpList" class="form-control form-control-dark" autocomplete="off" autocapitalize="characters" placeholder="Pilih POP dulu" disabled>
          <datalist id="odpList"></datalist>
          <div class="kecil">Ketik untuk mencari; nama yang belum ada di daftar akan disimpan sebagai ODP baru.</div>
        </div>
      </div>

      <div id="blokSN">
        <div class="mb-2 p-2 border border-info rounded">
          <label class="form-label small text-info fw-bold mb-1">✨ FOTO PERANGKAT (SN &amp; P-SN terisi otomatis dengan AI)</label>
          <div>
            <button type="button" id="btnLabel" class="btn btn-primary btn-sm fw-bold">📷 Foto Perangkat (Kamera)</button>
            <label class="btn btn-outline-info btn-sm fw-bold mb-0">🖼️ Dari Galeri<input type="file" id="fileLabel" accept="image/*" hidden></label>
            <span id="lblMsg" class="kecil ms-1"></span>
          </div>
          <img id="prevLabel" class="img-fluid rounded mt-2 d-none" style="max-height:140px;object-fit:cover" alt="Foto label">
          <div class="kecil">Foto label SN/P-SN terlihat jelas. Utamakan kamera. Jika AI tidak bisa membaca, isi manual atau pakai tombol Scan di bawah.</div>
        </div>
        <div class="row g-2 mb-1">
          <div class="col-12 col-md-6">
            <label class="form-label small text-secondary fw-bold mb-1">SN *</label>
            <div class="input-group">
              <input id="sn" class="form-control form-control-dark" placeholder="Contoh: DF1D-2503024515" autocapitalize="characters">
              <button class="btn btn-outline-info" type="button" data-scan="sn">📷 Scan</button>
            </div>
          </div>
          <div class="col-12 col-md-6">
            <label class="form-label small text-secondary fw-bold mb-1">P-SN *</label>
            <div class="input-group">
              <input id="psn" class="form-control form-control-dark" placeholder="Contoh: CDTCAF267337" autocapitalize="characters">
              <button class="btn btn-outline-info" type="button" data-scan="psn">📷 Scan</button>
            </div>
          </div>
        </div>
        <div class="kecil mb-2">SN dan P-SN wajib diisi keduanya.</div>
      </div>

      <div class="row g-2 mb-1">
        <div class="col-12 col-md-6">
          <label class="form-label small text-secondary fw-bold mb-1">Nama</label>
          <input id="nama" class="form-control form-control-dark" placeholder="Nama pelanggan">
        </div>
        <div class="col-12 col-md-6">
          <label class="form-label small text-secondary fw-bold mb-1">CID</label>
          <input id="cid" inputmode="numeric" class="form-control form-control-dark" placeholder="Nomor pelanggan">
        </div>
      </div>
      <div id="infoNC" class="kecil mb-2"></div>
      <div id="info" class="small text-info mb-2"></div>

      <div class="mb-2">
        <label class="form-label small text-secondary fw-bold mb-1">Keterangan</label>
        <textarea id="ket" class="form-control form-control-dark" rows="3"></textarea>
      </div>
      <div class="mb-3">
        <label class="form-label small text-secondary fw-bold mb-1">Nama Lengkap *</label>
        <input id="namaLengkap" class="form-control form-control-dark mb-2" placeholder="Nama lengkap Anda" autocomplete="name">
        <label class="form-label small text-secondary fw-bold mb-1">Teman / anggota tim lain <span class="kecil">(opsional)</span></label>
        <div id="temanBox"></div>
        <button type="button" id="btnTeman" class="btn btn-outline-info btn-sm">+ Tambah teman</button>
      </div>

      <button id="btnSimpan" class="btn btn-success w-100 fw-bold py-2">✔ Verif & Simpan</button>
      <div id="hasil" class="mt-3 small"></div>
    </div>
  </div>

  <script>
    var S = TMC.init({ active: 'input', title: '🚚 Input Terminate' });
    var $ = function (id) { return document.getElementById(id); };
    var KET = {
      TERMINATE: 'Perangkat sudah diambil dan port sudah dicabut. Sudah kembali ke gudang Perbaungan.',
      KUNJUNGAN: 'Client tidak ada dirumah',
      LANJUT: 'Client masih mau lanjut berlangganan'
    };
    var LBL = { TERMINATE: 'Foto Perangkat *', KUNJUNGAN: 'Foto Rumah *', LANJUT: 'Foto Bukti (CID & nama) *' };
    var foto = '', opts = {}, ketAuto = '';

    // Nama lengkap + teman: diingat di perangkat ini, dikirim sebagai daftar nama (dipisah koma) ke kolom TIM
    function lsGet(k) { try { return localStorage.getItem('tm_' + k) || ''; } catch (e) { return ''; } }
    function lsPut(k, v) { try { localStorage.setItem('tm_' + k, v); } catch (e) {} }
    $('namaLengkap').value = lsGet('nl_' + S.user) || S.nama || S.user || '';
    function tambahTeman(v) {
      var r = document.createElement('div'); r.className = 'd-flex gap-1 mb-1';
      r.innerHTML = '<input class="form-control form-control-dark" data-teman placeholder="Nama teman">' +
        '<button type="button" class="btn btn-outline-danger btn-sm" aria-label="Hapus teman">✕</button>';
      r.querySelector('input').value = v || '';
      r.querySelector('button').onclick = function () { r.remove(); };
      $('temanBox').appendChild(r);
    }
    $('btnTeman').onclick = function () { tambahTeman(''); };
    try { JSON.parse(lsGet('teman_' + S.user) || '[]').slice(0, 10).forEach(tambahTeman); } catch (e) {}
    function daftarTim() {
      var t = [$('namaLengkap').value.trim()];
      Array.prototype.forEach.call(document.querySelectorAll('[data-teman]'), function (e) { t.push(e.value.trim()); });
      return t.filter(Boolean);
    }

    function ubahJenis() {
      var j = $('jenis').value;
      $('blokSN').classList.toggle('d-none', j !== 'TERMINATE');
      $('blokFoto').classList.toggle('d-none', j === 'TERMINATE'); // Terminate: satu foto saja, dari kotak AI
      $('lblFoto').textContent = LBL[j];
      $('infoNC').textContent = j === 'TERMINATE'
        ? 'Nama dan CID boleh diisi jika sudah diketahui. Jika kosong, terisi otomatis dari data SN/P-SN atau dilengkapi lewat menu Edit.'
        : 'Nama dan CID wajib diisi.';
      var k = $('ket');
      if (!k.value.trim() || k.value === ketAuto) k.value = KET[j];
      ketAuto = KET[j];
    }
    $('jenis').onchange = ubahJenis; ubahJenis();

    function isiOdp(pilih) {
      var pop = $('pop').value, el = $('odp'), dl = $('odpList');
      dl.innerHTML = ''; el.value = '';
      el.disabled = !pop; el.placeholder = pop ? 'Ketik / pilih ODP' : 'Pilih POP dulu';
      (opts[pop] || []).forEach(function (o) { var x = document.createElement('option'); x.value = o; dl.appendChild(x); });
      if (pilih) setOdp(pilih);
    }
    function setOdp(v) { $('odp').value = String(v || '').toUpperCase(); }
    function nilaiOdp() { return $('odp').value.trim().toUpperCase(); }
    $('pop').onchange = function () { isiOdp(); };

    // AI: kolom ODP dicocokkan ke daftar ODP yang sudah ada (persis, lalu mengandung), kalau tidak ada dipakai apa adanya
    function cocokOdp(v) {
      var L = opts[$('pop').value] || [], u = String(v || '').toUpperCase().trim(); if (!u) return '';
      return L.filter(function (o) { return o.toUpperCase() === u; })[0] || L.filter(function (o) { return o.toUpperCase().indexOf(u) >= 0 || u.indexOf(o.toUpperCase()) >= 0; })[0] || u;
    }
    TMC.api('terminateAiIsi', { teks: '' }).then(function (r) {
      if (r && r.tm === 1 && r.code !== 'SESSION' && !/dinonaktifkan|belum diatur/.test(r.message || '')) $('aiBox').classList.remove('d-none');
    }).catch(function () {});
    $('aiBtn').onclick = function () {
      var t = $('aiTeks').value.trim(), m = $('aiMsg'), btn = this; if (!t) return;
      m.textContent = 'Memproses...'; btn.disabled = true;
      TMC.api('terminateAiIsi', { teks: t }).then(function (r) {
        if (!r || r.status !== 'success') { m.textContent = (r && r.message) || 'AI gagal.'; return; }
        var d = r.data, n = 0;
        if (d.pop) { $('pop').value = d.pop; isiOdp(); n++; }
        if (d.odp) { if ($('pop').value) { setOdp(cocokOdp(d.odp)); n++; } else m.textContent = 'POP belum terbaca, pilih POP lalu ketik ODP: ' + d.odp + '. '; }
        [['sn', d.sn], ['psn', d.psn], ['nama', d.nama_lama], ['cid', d.cid_lama]].forEach(function (p) { if (p[1] && $(p[0])) { $(p[0]).value = p[1]; n++; } });
        m.textContent = (m.textContent.indexOf('POP belum') === 0 ? m.textContent : '') + n + ' kolom terisi. Periksa lagi sebelum kirim.';
      }).catch(function () { m.textContent = 'Gagal terhubung.'; }).finally(function () { btn.disabled = false; });
    };

    TMC.api('terminateOptions').then(function (r) {
      if (r && r.status === 'success') { opts = r.odp || {}; isiOdp(); }
    });

    $('btnFoto').onclick = function () {
      TMC.openCamera(S.user).then(function (d) {
        foto = d; $('prev').src = d; $('prev').classList.remove('d-none'); $('btnFoto').textContent = '📷 Ulangi Foto';
      }).catch(function (e) { if (e.message !== 'dibatalkan') alert(e.message); });
    };

    // Foto label -> AI membaca SN & P-SN. Gagal/kosong = isi manual (kolom tidak diubah).
    function bacaLabel(dataUrl) {
      var m = $('lblMsg'); foto = dataUrl; $('prevLabel').src = dataUrl; $('prevLabel').classList.remove('d-none');
      m.textContent = 'AI membaca SN / P-SN...'; $('btnLabel').disabled = true;
      TMC.api('terminateAiFoto', { foto: dataUrl }).then(function (r) {
        if (!r || r.status !== 'success') { m.textContent = ((r && r.message) || 'AI gagal.') + ' Isi manual.'; return; }
        var d = r.data || {};
        if (d.sn) $('sn').value = d.sn;
        if (d.psn) $('psn').value = d.psn;
        m.textContent = d.sn && d.psn ? 'SN dan P-SN terisi. Periksa lagi sebelum simpan.'
          : d.sn || d.psn ? (d.sn ? 'SN' : 'P-SN') + ' terisi; ' + (d.sn ? 'P-SN' : 'SN') + ' tidak terbaca, isi manual / Scan.'
          : 'Tidak terbaca. Foto ulang lebih dekat dan terang, atau isi manual.';
        if (d.sn || d.psn) cek();
      }).catch(function () { m.textContent = 'Gagal terhubung. Isi manual.'; }).finally(function () { $('btnLabel').disabled = false; });
    }
    $('btnLabel').onclick = function () {
      TMC.openCamera('SN/P-SN ' + S.user).then(bacaLabel).catch(function (e) { if (e.message !== 'dibatalkan') alert(e.message); });
    };
    $('fileLabel').onchange = function () {
      var f = this.files[0]; this.value = ''; if (!f) return;
      var img = new Image(), u = URL.createObjectURL(f);
      img.onload = function () {
        var r = Math.min(1, 1400 / Math.max(img.width, img.height)), c = document.createElement('canvas');
        c.width = Math.round(img.width * r); c.height = Math.round(img.height * r);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(u);
        bacaLabel(c.toDataURL('image/jpeg', 0.8));
      };
      img.onerror = function () { URL.revokeObjectURL(u); $('lblMsg').textContent = 'File bukan gambar yang valid.'; };
      img.src = u;
    };

    var tCek = null;
    function cek() {
      var sn = $('sn').value.trim(), psn = $('psn').value.trim();
      if (!sn && !psn) return;
      $('info').textContent = 'Mencari data di Baris 1 / Baris 2 / Instalasi / MT...';
      TMC.api('terminateLookup', { sn: sn, psn: psn }).then(function (r) {
        if (!r || r.status !== 'success') { $('info').textContent = ''; return; }
        if (!r.found) { $('info').textContent = 'SN/P-SN belum ditemukan di data. Tetap bisa disimpan; Nama dan CID dilengkapi lewat menu Edit.'; return; }
        if (!$('nama').value && r.nama) $('nama').value = r.nama;
        if (!$('cid').value && r.cid) $('cid').value = r.cid;
        if (!$('pop').value && r.pop) { $('pop').value = r.pop; isiOdp(r.odp); }
        else if (!nilaiOdp() && r.odp) setOdp(r.odp);
        var tInfo = 'Ditemukan di sheet ' + r.sheet + (r.nama ? ': ' + r.nama : '') + (r.sheet === 'Baris 1' ? ' (akan dipindah ke Baris 2 saat disimpan)' : '');
        if (r.fotoRumah) {
          $('info').innerHTML = TMC.esc(tInfo) + '<div class="mt-2"><a href="' + TMC.esc(r.fotoRumah) + '" target="_blank"><img src="' + TMC.esc(TMC.thumb(r.fotoRumah, 300)) + '" alt="foto rumah" style="max-width:220px;border-radius:8px;border:1px solid #3a506b"></a><div class="kecil">Foto rumah dari client (klik untuk memperbesar)</div></div>';
        } else $('info').textContent = tInfo;
      });
    }
    ['sn', 'psn'].forEach(function (id) {
      $(id).addEventListener('input', function () { clearTimeout(tCek); tCek = setTimeout(cek, 900); });
    });
    document.querySelectorAll('[data-scan]').forEach(function (b) {
      b.onclick = function () {
        var id = b.getAttribute('data-scan');
        TMC.scanCode(id === 'sn' ? 'Scan barcode SN' : 'Scan barcode P-SN').then(function (v) {
          $(id).value = v; cek();
        }).catch(function (e) { if (e.message !== 'dibatalkan') alert(e.message); });
      };
    });

    $('btnSimpan').onclick = function () {
      var j = $('jenis').value, pop = $('pop').value, odp = nilaiOdp();
      var sn = $('sn').value.trim(), psn = $('psn').value.trim(), nama = $('nama').value.trim(), cid = $('cid').value.trim();
      if (!foto) { alert(j === 'TERMINATE' ? 'Foto perangkat wajib diambil (kamera / galeri).' : 'Foto wajib diambil dengan kamera.'); return; }
      var tim = daftarTim();
      if (!$('namaLengkap').value.trim()) { alert('Nama lengkap wajib diisi.'); return; }
      if (!pop) { alert('POP wajib dipilih.'); return; }
      if (!odp) { alert('ODP wajib dipilih/diisi.'); return; }
      if (j === 'TERMINATE') { if (!sn || !psn) { alert('SN dan P-SN wajib diisi keduanya.'); return; } if (sn.toUpperCase().replace(/\s+/g,'') === psn.toUpperCase().replace(/\s+/g,'')) { alert('SN dan P-SN tidak boleh sama. Scan ulang salah satunya.'); return; } }
      else if (!nama || !cid) { alert('Nama dan CID wajib diisi.'); return; }

      var btn = $('btnSimpan'), hasil = $('hasil');
      btn.disabled = true; btn.textContent = 'Memproses...'; hasil.innerHTML = '';
      TMC.api('terminateSimpan', {
        jenis: j, pop: pop, odp: odp, sn: sn, psn: psn, nama: nama, cid: cid,
        ket: $('ket').value.trim() || KET[j], tim: tim.join(', '), foto: foto
      }).then(function (res) {
        if (res.status === 'success') {
          var d = res.data || {};
          hasil.innerHTML = '<div class="alert alert-success py-2 mb-0">Tersimpan.<br>Nama: ' + TMC.esc(d.nama || '-') + ' | CID: ' + TMC.esc(d.cid || '-') +
            '<br>POP: ' + TMC.esc(d.pop) + ' | ODP: ' + TMC.esc(d.odp) +
            (d.sn ? '<br>SN: ' + TMC.esc(d.sn) + ' | P-SN: ' + TMC.esc(d.psn) : '') +
            (d.verif ? '<br>Verif: ' + TMC.esc(d.verif) : '') +
            ((j === 'TERMINATE' && (!d.nama || !d.cid)) ? '<br><b>Nama/CID belum terisi, lengkapi lewat menu Edit.</b>' : '') + '</div>';
          lsPut('nl_' + S.user, $('namaLengkap').value.trim()); lsPut('teman_' + S.user, JSON.stringify(tim.slice(1)));
          foto = ''; $('prev').classList.add('d-none'); $('btnFoto').textContent = '📷 Ambil Foto (Kamera)';
          ['sn', 'psn', 'nama', 'cid'].forEach(function (id) { $(id).value = ''; });
          $('info').textContent = ''; $('ket').value = KET[j]; ketAuto = KET[j];
          $('prevLabel').classList.add('d-none'); $('lblMsg').textContent = '';
        } else {
          hasil.innerHTML = '<div class="alert alert-danger py-2 mb-0">' + TMC.esc(res.message || 'Gagal menyimpan.') + '</div>';
        }
      }).catch(function () {
        hasil.innerHTML = '<div class="alert alert-danger py-2 mb-0">Gagal terhubung ke server.</div>';
      }).finally(function () { btn.disabled = false; btn.textContent = '✔ Verif & Simpan'; });
    };
  </script>
</body>
</html>
