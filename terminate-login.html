<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Terminate - Sistem Lapangan</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background:#0b132b; color:#e0e6ed; font-family:'Segoe UI',sans-serif; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:16px; }
    .card-custom { background:#1c2541; border:1px solid #2a385b; border-radius:14px; width:100%; max-width:380px; }
    .form-control-dark { background:#0b132b; border:1px solid #3a506b; color:#fff; }
    .form-control-dark:focus { background:#0b132b; color:#fff; border-color:#38bdf8; box-shadow:none; }
  </style>
  <script src="terminate-core.js"></script>
</head>
<body>
  <div class="card-custom p-4">
    <div class="text-center mb-3">
      <div style="font-size:2.2rem">🚚</div>
      <h5 class="fw-bold mb-0">Login Tim Terminate</h5>
      <div class="small text-secondary">Khusus Admin dan Sub Admin. Sesi berlaku 12 jam.</div>
    </div>
    <div id="pesan" class="mb-2"></div>
    <form id="f" autocomplete="on">
      <div class="mb-2">
        <label class="form-label small text-secondary fw-bold mb-1">Username</label>
        <input id="u" class="form-control form-control-dark" autocomplete="username" required>
      </div>
      <div class="mb-3">
        <label class="form-label small text-secondary fw-bold mb-1">Password</label>
        <input id="p" type="password" class="form-control form-control-dark" autocomplete="current-password" required>
      </div>
      <button id="btn" class="btn btn-success w-100 fw-bold py-2">Masuk</button>
    </form>
  </div>

  <script>
    var $ = function (id) { return document.getElementById(id); };
    function tampil(t, jenis) { $('pesan').innerHTML = t ? '<div class="alert alert-' + jenis + ' py-2 mb-0 small">' + TMC.esc(t) + '</div>' : ''; }
    if (TMC.getSession()) location.replace('terminate.html');
    var m = new URLSearchParams(location.search).get('m');
    if (m) tampil(m, 'warning');

    $('f').addEventListener('submit', function (e) {
      e.preventDefault();
      var btn = $('btn'); btn.disabled = true; btn.textContent = 'Memeriksa...';
      tampil('', '');
      TMC.login($('u').value.trim(), $('p').value).then(function (res) {
        if (res && res.status === 'success') { location.replace('terminate.html'); return; }
        tampil((res && res.message) || 'Login gagal. Pastikan Terminate.gs sudah dipasang di doPost dan di-deploy versi baru.', 'danger');
      }).catch(function () {
        tampil('Gagal terhubung ke server.', 'danger');
      }).finally(function () { btn.disabled = false; btn.textContent = 'Masuk'; });
    });
  </script>
</body>
</html>
