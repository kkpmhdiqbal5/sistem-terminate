<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Sistem Lapangan Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #0f172a;
      color: #e2e8f0;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    .login-card {
      background-color: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      width: 100%;
      max-width: 400px;
      padding: 30px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
    }
    .form-control {
      background-color: #0f172a;
      border: 1px solid #334155;
      color: #f8fafc;
    }
    .form-control:focus {
      background-color: #0f172a;
      border-color: #38bdf8;
      color: #f8fafc;
      box-shadow: 0 0 0 0.25rem rgba(56, 189, 248, 0.25);
    }
    .btn-login {
      background-color: #0284c7;
      border: none;
      font-weight: 600;
      padding: 10px;
    }
    .btn-login:hover {
      background-color: #0369a1;
    }
  </style>
</head>
<body>

  <div class="login-card">
    <div class="text-center mb-4">
      <h4 class="fw-bold text-info m-0">🔐 Login</h4>
      <small class="text-muted">Admin, Sub Admin & Tim Terminate (sesi 12 jam)</small>
    </div>

    <form id="loginForm">
      <div class="mb-3">
        <label class="form-label small fw-bold text-slate-300">Username</label>
        <input type="text" id="username" class="form-control" placeholder="Masukkan username" required autocomplete="username">
      </div>
      
      <div class="mb-4">
        <label class="form-label small fw-bold text-slate-300">Password</label>
        <input type="password" id="password" class="form-control" placeholder="Masukkan password" required autocomplete="current-password">
      </div>

      <button type="submit" id="btnLogin" class="btn btn-login btn-primary w-100 mb-3">
        Masuk Sistem
      </button>

      <a href="index.html" class="btn btn-outline-secondary btn-sm w-100 text-slate-300">
        ← Kembali ke Form Lapangan
      </a>
    </form>
  </div>

  <script src="auth.js"></script>
  <script>
    // URL Web App Google Apps Script Anda
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzsS4-LPktyuUKoC6Cf6TERV498wqvm31frvD7-W0gFhrCb9fkgwVBjAHeLrEeVMd25/exec";
    const params = new URLSearchParams(location.search);
    function pilihTujuan() {
      const n = (params.get("next") || "").split("?")[0];
      if (/^[a-z0-9-]+\.html$/i.test(n) && n !== "login.html") return n;   // guard halaman tujuan mengalihkan bila tak punya izin
      return Auth.home();
    }

    // Sudah login (sesi 12 jam masih berlaku) -> langsung masuk
    window.onload = function () {
      if (params.get("m")) alert(params.get("m"));
      if (Auth.get()) window.location.href = pilihTujuan();
    };

    document.getElementById('loginForm').addEventListener('submit', function (e) {
      e.preventDefault();
      const user = document.getElementById('username').value.trim();
      const pass = document.getElementById('password').value;
      const btn = document.getElementById('btnLogin');
      btn.disabled = true;
      btn.innerText = "Memverifikasi...";

      // POST (password tidak ikut di URL). Satu login untuk semua halaman, sesi 12 jam.
      fetch(SCRIPT_URL, { method: "POST", body: JSON.stringify({ action: "terminateLogin", username: user, password: pass }) })
        .then(r => r.json())
        .then(res => {
          if (res.tm !== 1) { alert("Backend (Apps Script) belum diperbarui. Tempel Terminate.gs terbaru lalu Deploy > New version."); return; }
          if (res.status === "success") {
            Auth.save(res);
            window.location.href = pilihTujuan();
          } else {
            alert(res.message || "Username atau password salah!");
          }
        })
        .catch(err => alert("Gagal terhubung ke server login! Periksa koneksi atau URL Apps Script."))
        .finally(() => {
          btn.disabled = false;
          btn.innerText = "Masuk Sistem";
        });
    });
  </script>
</body>
</html>
