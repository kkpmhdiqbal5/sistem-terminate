<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Perangkat Sudah Diambil - Sistem Terminate</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="auth.js"></script>
  <script src="menu-grup.js"></script>
  <script src="terminate-core.js"></script>
</head>
<body>
  <div class="container px-3 pt-3">
    <div class="card-custom p-3 mb-3">
      <div class="fw-bold text-white mb-1">📦 Perangkat Sudah Diambil</div>
      <div class="kecil mb-2" id="tgl">Bawaan hari ini; pilih Dari/Sampai untuk tanggal lain.</div>
      <div class="row g-2 mb-2"><div class="col-6"><label class="form-label small text-secondary mb-1">Dari</label><input type="date" id="tDari" class="form-control form-control-dark"></div><div class="col-6"><label class="form-label small text-secondary mb-1">Sampai</label><input type="date" id="tSd" class="form-control form-control-dark"></div></div>
      <div class="row g-2 align-items-end">
        <div class="col-8" id="kolFilter" style="display:none">
          <label class="form-label small text-secondary fw-bold mb-1">Sub admin</label>
          <select id="fAdmin" class="form-select form-select-dark"><option value="">Semua sub admin</option></select>
        </div>
        <div class="col-4"><button id="btnMuat" class="btn btn-info btn-sm w-100 fw-bold py-2">🔄 Muat</button></div>
      </div>
      <div id="pesan" class="mt-2"></div>
    </div>
    <div id="jumlah" class="small text-info mb-2"></div>
    <div id="daftar"></div>
  </div>
  <script>
    var S = TMC.init({ active: 'diambil', title: '📦 Sudah Diambil' });

    var $ = function (id) { return document.getElementById(id); };
    function pesan(t, j) { $('pesan').innerHTML = t ? '<div class="alert alert-' + j + ' py-2 mb-0 small">' + TMC.esc(t) + '</div>' : ''; }
    function foto(x) {
      var t = TMC.thumb(x.foto, 200);
      return t ? '<a href="' + TMC.esc(x.foto) + '" target="_blank" rel="noopener"><img class="thumb" src="' + TMC.esc(t) + '" alt="Foto"></a>' : '';
    }
    function kartu(x, extra) {
      return '<div class="card-custom p-3 mb-2"><div class="d-flex gap-3">' + foto(x) + '<div class="small flex-grow-1">' +
        '<div class="kecil">' + TMC.esc(x.waktu) + ' | <b class="text-info">' + TMC.esc(x.admin) + '</b> | ' + TMC.esc(x.jenis) + '</div>' +
        '<div><b>' + TMC.esc(x.nama || '(nama belum diisi)') + '</b> | CID: ' + TMC.esc(x.cid || '-') + '</div>' +
        '<div>POP: ' + TMC.esc(x.pop) + ' | ODP: ' + TMC.esc(x.odp) + '</div>' +
        (x.sn || x.psn ? '<div>SN: ' + TMC.esc(x.sn || '-') + ' | P-SN: ' + TMC.esc(x.psn || '-') + '</div>' : '') +
        '<div class="kecil">Verif: ' + TMC.esc(x.verif || '-') + '</div>' + (extra || '') + '</div></div></div>';
    }
    function salin(t) {
      if (navigator.clipboard && navigator.clipboard.writeText) return navigator.clipboard.writeText(t);
      var a = document.createElement('textarea'); a.value = t; document.body.appendChild(a); a.select(); document.execCommand('copy'); a.remove(); return Promise.resolve();
    }

    var data = [], adaFilter = false;
    function caption(x) {
      return 'An : ' + x.nama + '\nCid : ' + x.cid + '\nSn : ' + x.sn + '\nP-Sn : ' + x.psn + '\nOdp : ' + x.odp + '\nKet : ' + x.ket;
    }
    function render() {
      var d = $('daftar'); d.innerHTML = '';
      $('jumlah').textContent = data.length + ' perangkat';
      if (!data.length) { d.innerHTML = '<div class="text-center text-secondary py-4">Belum ada perangkat diambil hari ini.</div>'; return; }
      data.forEach(function (x, i) {
        var w = document.createElement('div'); w.innerHTML = kartu(x, '<button class="btn btn-outline-info btn-sm py-0 mt-1" data-i="' + i + '">Salin caption</button> <button class="btn btn-outline-warning btn-sm py-0 mt-1" data-e="' + i + '">✏️ Edit</button> <button class="btn btn-outline-danger btn-sm py-0 mt-1" data-h="' + i + '">🗑 Hapus</button><div data-box="' + i + '"></div>');
        d.appendChild(w.firstChild);
      });
    }
    var KOL = [['nama', 'Nama'], ['cid', 'CID'], ['odp', 'ODP'], ['pop', 'POP'], ['sn', 'SN'], ['psn', 'P-SN'], ['ket', 'Keterangan']];
    $('daftar').addEventListener('click', function (e) {
      var t = e.target, g = function (k) { return t.getAttribute && t.getAttribute(k); };
      if (g('data-i') != null) { salin(caption(data[g('data-i')])).then(function () { t.textContent = 'Tersalin ✔'; }); return; }
      if (g('data-e') != null) {
        var i = g('data-e'), x = data[i], box = t.parentNode.querySelector('[data-box="' + i + '"]');
        if (box.innerHTML) { box.innerHTML = ''; return; }
        box.innerHTML = '<div class="row g-2 mt-1">' + KOL.map(function (k) { return '<div class="col-6"><label class="kecil">' + k[1] + '</label><input class="form-control form-control-dark form-control-sm" data-f="' + k[0] + '" value="' + TMC.esc(x[k[0]]) + '"></div>'; }).join('') +
          '</div><button class="btn btn-success btn-sm mt-2 fw-bold" data-s="' + i + '">Simpan</button> <span class="kecil" data-m></span>';
        return;
      }
      if (g('data-s') != null) {
        var j = g('data-s'), y = data[j], bx = t.parentNode, p = { id: y.id }, m = bx.querySelector('[data-m]');
        KOL.forEach(function (k) { p[k[0]] = bx.querySelector('[data-f=' + k[0] + ']').value.trim(); });
        if (p.cid && !/^\d{6,20}$/.test(p.cid.replace(/\s+/g, ''))) { m.textContent = 'CID harus angka 6-20 digit.'; return; }
        t.disabled = true; m.textContent = 'Menyimpan...';
        TMC.api('terminateEditLengkap', p).then(function (r) {
          if (r.status === 'success') { KOL.forEach(function (k) { y[k[0]] = p[k[0]]; }); render(); pesan('Data tersimpan.', 'success'); } else { m.textContent = r.message; t.disabled = false; }
        }).catch(function () { m.textContent = 'Gagal terhubung ke server.'; t.disabled = false; });
        return;
      }
      if (g('data-h') != null) {
        var z = data[g('data-h')];
        if (!confirm('Hapus data ' + (z.nama || z.cid || z.sn) + ' (CID ' + (z.cid || '-') + ') dari SEMUA sheet?\nTidak bisa dibatalkan.')) return;
        t.disabled = true;
        TMC.api('terminateHapus', { id: z.id }).then(function (r) {
          if (r.status === 'success') { data.splice(data.indexOf(z), 1); render(); pesan(r.message, 'success'); } else { pesan(r.message, 'danger'); t.disabled = false; }
        }).catch(function () { pesan('Gagal terhubung ke server.', 'danger'); t.disabled = false; });
      }
    });
    function muat() {
      var b = $('btnMuat'); b.disabled = true; pesan('Memuat...', 'secondary');
      TMC.api('terminateList', { admin: $('fAdmin').value, dari: $('tDari').value, sampai: $('tSd').value }).then(function (r) {
        if (r.status !== 'success') { pesan(r.message, 'danger'); data = []; render(); return; }
        pesan('', ''); data = r.data; $('tgl').textContent = ($('tDari').value ? 'Tanggal: ' : 'Hari ini: ') + r.tanggal;
        if (r.role === 'ADMIN') {
          $('kolFilter').style.display = '';
          if (!adaFilter) {
            adaFilter = true; var sel = $('fAdmin');
            r.admins.forEach(function (a) { var o = document.createElement('option'); o.value = a; o.textContent = a; sel.appendChild(o); });
          }
        }
        render();
      }).catch(function () { pesan('Gagal terhubung ke server.', 'danger'); }).finally(function () { b.disabled = false; });
    }
    $('btnMuat').onclick = muat; $('fAdmin').onchange = muat; $('tDari').onchange = $('tSd').onchange = muat; muat();
  </script>
</body>
</html>
